name: Dependencies

# GitHub cannot read Gradle dependencies from build.gradle on its own. This workflow
# submits the resolved dependency graph, which Dependabot alerts and dependency
# review both rely on.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  review:
    if: github.event_name == 'pull_request'
    needs: submit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # The graph for this PR was submitted by the job above; wait for it instead of warning.
          retry-on-snapshot-warnings: true
