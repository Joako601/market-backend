buildscript {
	configurations.classpath {
		resolutionStrategy.eachDependency {
			// spring-boot-gradle-plugin 4.0.9 pulls httpcore5 5.3.6 (CVE-2026-54399) for bootBuildImage.
			// Drop this once a Spring Boot release ships httpcore5 5.4.3 or later.
			if (requested.group == 'org.apache.httpcomponents.core5') {
				useVersion '5.4.3'
			}
		}
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'mx.edu.tecdesotware'
// release-please bumps version.txt; do not edit it by hand.
version = file('version.txt').text.trim()

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.mapstruct:mapstruct:1.6.3'

	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
}

tasks.named('test') {
	useJUnitPlatform()
}
